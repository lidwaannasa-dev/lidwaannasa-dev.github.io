<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chathead Notes - Take notes without switching apps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(#eef5ff,#dfeaff);color:#111}
.container{max-width:480px;margin:auto;padding:24px}
header{text-align:center;padding:20px 0}
.logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 12px}
h1{font-size:2.3rem}
.hero h2{text-align:center;font-size:2.6rem;line-height:1.05;margin:10px 0 24px}
.hero h2 span{color:#2f6bff}
.hero img{width:100%;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.15)}
.features{display:grid;gap:14px;margin:28px 0}
.card{background:#fff;padding:18px;border-radius:18px;text-align:center}
.play{display:block;text-decoration:none;background:#000;color:#fff;text-align:center;padding:18px;border-radius:16px;font-weight:bold;font-size:1.15rem;margin:26px 0}
.info{background:#fff;border-radius:22px;padding:24px;text-align:center}
.info h3{font-size:1.9rem;line-height:1.15}.info h3 span{color:#2f6bff}
.info p{margin-top:12px;color:#666}
.badges{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px;margin-top:30px}
.badges img{max-width:100%;height:auto}
footer{text-align:center;padding:30px;color:#777}
@media(min-width:768px){.container{max-width:900px}.features{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="container">
<header>
<img class="logo" src="assets/app-icon.png" alt="Chathead Notes Icon">
<h1>Chathead Notes</h1>
</header>
<section class="hero">
<h2>Take notes <span>without switching apps.</span></h2>
<img src="assets/hero.png" alt="Chathead Notes Screenshot">
</section>
<section class="features">
<div class="card"><strong>Stays on top</strong><br>Over any app</div>
<div class="card"><strong>Instant access</strong><br>With one tap</div>
<div class="card"><strong>Simple & Fast</strong><br>Distraction free</div>
</section>
<a class="play" href="https://play.google.com/store/apps/details?id=com.success.chatheadnotes" target="_blank">Get it on Google Play</a>
<section class="info">
<h3>Floating chathead style notes<br><span>that stay on top of any app.</span></h3>
<p>Capture a thought without breaking your flow.</p>
</section>
<div class="badges">
<a href="https://auraplusplus.com/projects/chathead-notes" target="_blank" rel="noopener">
  <img src="https://auraplusplus.com/images/badges/featured-on-light.svg" alt="Featured on Aura++" width="265" height="58" />
</a>
<a href="https://earlyhunt.com/project/chathead-notes" target="_blank" rel="noopener">
  <img src="https://earlyhunt.com/badges/earlyhunt-badge-light.svg" alt="Featured on EarlyHunt" width="265" height="58" />
</a>
</div>
<footer>© Chathead Notes</footer>
</div>
</body>
</html>
